name: Feature Request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: concern
    attributes:
      label: Which concern does this relate to?
      options:
        - Features (TDD pipeline)
        - Knowledge (/kb, /research)
        - Decisions (/architect, /decisions)
        - Curation (/curate)
        - System (install, upgrade, help)
        - New concern / cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow pain point or gap you're experiencing.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you expect this to work? Which command(s) would be involved?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: How are you currently working around this? Are there other approaches?
    validations:
      required: false

  - type: dropdown
    id: principle-check
    attributes:
      label: Does this require external dependencies?
      description: "Vallorcine is bash-first with zero required dependencies (design principle 1). Features may use Python/JS for enhanced implementations, but every capability must work with bash alone."
      options:
        - "No — works with bash alone"
        - "Yes — requires a runtime or external tooling with no bash fallback"
        - "Enhanced — bash fallback exists, but Python/JS improves it"
        - "Not sure"
    validations:
      required: true
